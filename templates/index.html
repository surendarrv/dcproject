<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Agent System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-content {
            padding: 40px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .output-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #4facfe;
        }
        
        .output-text {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #e1e5e9;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
        }
        
        .correction-section {
            margin-top: 20px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }
        
        .suggestions {
            margin-top: 15px;
        }
        
        .suggestion-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #e1e5e9;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .suggestion-item:hover {
            background: #e9ecef;
        }
        
        .confidence {
            font-size: 0.9em;
            color: #6c757d;
            margin-left: 10px;
        }
        
        .stats-section {
            margin-top: 30px;
            padding: 20px;
            background: #d1ecf1;
            border-radius: 8px;
            border-left: 4px solid #17a2b8;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4facfe;
        }
        
        .stat-label {
            color: #6c757d;
            margin-top: 5px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid;
        }
        
        .alert-success {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .alert-error {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Adaptive Agent System</h1>
            <p>An AI agent that learns from your corrections and improves over time</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <div class="input-group">
                    <label for="inputText">Enter your input:</label>
                    <input type="text" id="inputText" placeholder="Type something for the agent to process...">
                </div>
                
                <div class="input-group">
                    <label for="context">Context (optional):</label>
                    <textarea id="context" placeholder="Provide additional context for better results..."></textarea>
                </div>
                
                <div class="button-group">
                    <button class="btn-primary" onclick="generateOutput()">Generate Output</button>
                    <button class="btn-secondary" onclick="getSuggestions()">Get Suggestions</button>
                    <button class="btn-secondary" onclick="loadStats()">View Stats</button>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing...</p>
            </div>
            
            <div class="output-section" id="outputSection" style="display: none;">
                <h3>Agent Output:</h3>
                <div class="output-text" id="outputText"></div>
                
                <div class="correction-section">
                    <h4>Correct the output:</h4>
                    <textarea id="correctedOutput" placeholder="Enter the corrected version here..."></textarea>
                    <div class="button-group">
                        <button class="btn-success" onclick="submitCorrection()">Submit Correction</button>
                    </div>
                </div>
            </div>
            
            <div class="suggestions" id="suggestionsSection" style="display: none;">
                <h3>Auto-correction Suggestions:</h3>
                <div id="suggestionsList"></div>
            </div>
            
            <div class="stats-section" id="statsSection" style="display: none;">
                <h3>Learning Statistics:</h3>
                <div class="stats-grid" id="statsGrid"></div>
            </div>
        </div>
    </div>

    <script>
        let currentOutput = '';
        
        async function generateOutput() {
            const inputText = document.getElementById('inputText').value;
            const context = document.getElementById('context').value;
            
            if (!inputText.trim()) {
                alert('Please enter some input text');
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        input_text: inputText,
                        context: context ? JSON.parse(context) : {}
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentOutput = data.output;
                    document.getElementById('outputText').textContent = data.output;
                    document.getElementById('outputSection').style.display = 'block';
                    showAlert('Output generated successfully!', 'success');
                } else {
                    showAlert('Error: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        async function submitCorrection() {
            const correctedOutput = document.getElementById('correctedOutput').value;
            
            if (!correctedOutput.trim()) {
                alert('Please enter a corrected version');
                return;
            }
            
            try {
                const response = await fetch('/api/correct', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        corrected_output: correctedOutput
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Correction learned successfully! The agent will improve based on this feedback.', 'success');
                    document.getElementById('correctedOutput').value = '';
                } else {
                    showAlert('Error: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }
        
        async function getSuggestions() {
            const outputText = document.getElementById('outputText').textContent;
            
            if (!outputText.trim()) {
                alert('Please generate an output first');
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch('/api/suggestions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        output_text: outputText,
                        context: {}
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displaySuggestions(data.suggestions);
                } else {
                    showAlert('Error: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        function displaySuggestions(suggestions) {
            const suggestionsList = document.getElementById('suggestionsList');
            suggestionsList.innerHTML = '';
            
            if (suggestions.length === 0) {
                suggestionsList.innerHTML = '<p>No suggestions available</p>';
            } else {
                suggestions.forEach(suggestion => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.innerHTML = `
                        ${suggestion.text}
                        <span class="confidence">(${Math.round(suggestion.confidence * 100)}% confidence)</span>
                    `;
                    item.onclick = () => {
                        document.getElementById('correctedOutput').value = suggestion.text;
                    };
                    suggestionsList.appendChild(item);
                });
            }
            
            document.getElementById('suggestionsSection').style.display = 'block';
        }
        
        async function loadStats() {
            showLoading(true);
            
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                if (data.success) {
                    displayStats(data.stats);
                } else {
                    showAlert('Error: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        function displayStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-item">
                    <div class="stat-number">${stats.total_feedback}</div>
                    <div class="stat-label">Total Feedback</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${stats.learned_patterns}</div>
                    <div class="stat-label">Learned Patterns</div>
                </div>
            `;
            
            if (stats.patterns && stats.patterns.length > 0) {
                stats.patterns.forEach(pattern => {
                    const patternItem = document.createElement('div');
                    patternItem.className = 'stat-item';
                    patternItem.innerHTML = `
                        <div class="stat-number">${Math.round(pattern.confidence * 100)}%</div>
                        <div class="stat-label">Pattern ${pattern.id}</div>
                        <div class="stat-label">Used ${pattern.usage_count} times</div>
                    `;
                    statsGrid.appendChild(patternItem);
                });
            }
            
            document.getElementById('statsSection').style.display = 'block';
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            const container = document.querySelector('.main-content');
            container.insertBefore(alertDiv, container.firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }
        
        // Allow Enter key to generate output
        document.getElementById('inputText').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateOutput();
            }
        });
    </script>
</body>
</html>
