version: '3.8'

services:
  adaptive-agent:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./feedback.db:/app/feedback.db
      - ./models:/app/models
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - adaptive-agent
    restart: unless-stopped